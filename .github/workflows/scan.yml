name: k8s-sec

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Scan manifests (fail on HIGH+)
        run: |
          ./target/release/k8s-sec --cli \
            --format sarif \
            --output k8s-sec.sarif \
            --fail-on high \
            examples

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: k8s-sec.sarif
        continue-on-error: true
